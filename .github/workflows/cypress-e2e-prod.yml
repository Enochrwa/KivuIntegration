name: Cypress E2E Prod

on:
  schedule:
    # Once per day at 00:00 UTC
    - cron: "0 0 * * *"

env:
  # Production-specific variables/secrets.
  CYPRESS_BASE_URL: ${{ vars.CYPRESS_PROD_BASE_URL || secrets.CYPRESS_PROD_BASE_URL }}
  CYPRESS_ADMIN_URL: ${{ vars.CYPRESS_PROD_ADMIN_URL || secrets.CYPRESS_PROD_ADMIN_URL }}
  CYPRESS_ADMIN_EMAIL: ${{ secrets.CYPRESS_PROD_ADMIN_EMAIL }}
  CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_PROD_ADMIN_PASSWORD }}
  CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_PROD_USER_PASSWORD }}
  CYPRESS_STORE_ADMIN_EMAIL: ${{ secrets.CYPRESS_PROD_STORE_ADMIN_EMAIL }}
  CYPRESS_STORE_CLERK_EMAIL: ${{ secrets.CYPRESS_PROD_STORE_CLERK_EMAIL }}
  CYPRESS_STORE_ANALYST_EMAIL: ${{ secrets.CYPRESS_PROD_STORE_ANALYST_EMAIL }}
  CYPRESS_DEFAULT_LANG: ${{ vars.CYPRESS_DEFAULT_LANG || secrets.CYPRESS_DEFAULT_LANG }}
  CYPRESS_USER_AGENT: ${{ secrets.CYPRESS_USER_AGENT }}
  GH_FE_COMMON_TOKEN: ${{ secrets.GH_FE_COMMON_TOKEN }}

jobs:
  cypress-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # Required to install @kivunova/kivufrontendcommon from GitHub Packages
      issues: write # Create/update issue when Cypress fails

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kivunova"

      - name: Create `.npmrc` for authentication
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc

      - name: Check required env
        run: |
          if [ -z "$CYPRESS_BASE_URL" ]; then
            echo "::error::CYPRESS_PROD_BASE_URL is not set. Add it as a repository variable (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Cypress (full suite)
        id: cypress
        run: npm run cy:run
        continue-on-error: false

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-prod-screenshots
          path: cypress/screenshots

      - name: Slack notification on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            STATUS="${{ steps.cypress.outcome }}"
            EMOJI=":x:"
            MSG="*PROD E2E tests failed*"
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"${EMOJI} ${MSG}\\nWorkflow: ${{ github.workflow }}\\nStatus: ${STATUS}\\nBranch: ${{ github.ref_name }}\\nActor: ${{ github.actor }}\\n\\n:link: View build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL" || true
          fi

      - name: Create or update GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const envName = "Production";
            const titlePrefix = `[${envName}] Cypress E2E failure`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `**Environment:** ${envName}`,
              `**Workflow:** ${context.workflow}`,
              `**Run:** ${runUrl}`,
              `**Branch:** ${context.ref}`,
              `**Commit:** \`${context.sha.slice(0, 7)}\``,
              `**Triggered by:** ${context.actor}`,
              ``,
              `Investigate the failing Cypress run (screenshots/videos are uploaded as workflow artifacts).`
            ].join("\n");

            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${titlePrefix}"`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q });
            const existing = search.items.find((i) => i.title.startsWith(titlePrefix));

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Subsequent failure\n${runUrl}\n_${context.workflow} · ${new Date().toISOString()}_`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `${titlePrefix} (${context.workflow} #${context.runNumber})`,
                body,
                labels: ["e2e-production"]
              });
            }

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-prod-videos
          path: cypress/videos
